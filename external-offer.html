<!doctype html>
<html lang="en"><head>
<style data-admin-canvas>html,body{background:#0b1220}</style>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking offer</title><link rel="stylesheet" href="css/admin.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:18px}.offer-card{width:min(620px,100%);background:#fff;color:#172033;border-radius:18px;padding:28px;box-shadow:0 24px 70px #0008}.offer-route{padding:16px;background:#f1f5f9;border-radius:12px;font-weight:750}.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.offer-actions{display:flex;gap:12px;margin-top:22px}.offer-actions button{flex:1;min-height:48px}.decline{background:#b91c1c}@media(max-width:560px){.offer-grid{grid-template-columns:1fr}.offer-actions{flex-direction:column}}</style></head>
<body><main class="offer-card"><p>Secure booking decision</p><h1 id="offerTitle">Loading…</h1><div id="offerContent" role="status"></div><div class="offer-actions" id="offerActions" hidden><button id="acceptOffer">Accept booking</button><button class="decline" id="declineOffer">Decline</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/external-offer.js"></script></body></html>
