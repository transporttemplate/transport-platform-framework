<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bookings</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/customer-portal.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/supabase.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/customer-account.js"></script>
</head>
<body class="customer-portal-page">
<main class="portal-shell portal-account-shell">
<header class="portal-header">
<div class="portal-brand portal-brand-compact">
<div class="portal-logo-wrap">
<img id="portalCompanyLogo" class="portal-logo" hidden alt="">
<span id="portalCompanyLogoFallback" class="portal-logo-fallback" aria-hidden="true">TB</span>
</div>
<div><p id="portalCompanyName" class="portal-company-name"></p><h1>My Bookings</h1></div>
</div>
<button id="customerLogout" class="portal-secondary-button" type="button">Logout</button>
</header>

<nav class="portal-tabs portal-account-tabs" aria-label="My account">
<button class="active" data-booking-view="upcoming">Upcoming</button>
<button data-booking-view="previous">Previous</button>
<button data-booking-view="cancelled">Cancelled</button>
<button data-booking-view="details">My Details</button>
</nav>
<div id="portalMessage" class="portal-notice" aria-live="polite" hidden></div>
<section id="customerBookingList" class="booking-card-list"></section>
<section id="customerProfile" class="portal-card portal-profile-card" hidden>
<h2>My Details</h2>
<p class="portal-muted">Keep your contact information up to date.</p>
<form id="customerProfileForm" class="portal-form">
<label for="profileName">Name</label><input id="profileName" required>
<label for="profilePhone">Phone</label><input id="profilePhone" inputmode="tel">
<label for="profileEmail">Email</label><input id="profileEmail" type="email" disabled>
<button class="portal-primary-button" type="submit">Save Details</button>
</form>
</section>
</main>

<dialog id="customerBookingDialog" class="portal-dialog">
<div class="portal-dialog-header"><strong>Booking details</strong><button id="closeCustomerBooking" class="dialog-close" type="button" aria-label="Close booking details">Close</button></div>
<div id="customerBookingDetail"></div>
</dialog>
</body>
</html>
