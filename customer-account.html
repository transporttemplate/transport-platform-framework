<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/customer-portal.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase.js"></script><script defer src="js/config.js"></script><script defer src="js/customer-account.js"></script></head><body><main class="portal-shell wide"><header class="portal-header"><div><h1>My Bookings</h1><p id="portalCompanyName"></p></div><button id="customerLogout" type="button">Logout</button></header><nav class="portal-tabs"><button class="active" data-booking-view="upcoming">Upcoming</button><button data-booking-view="previous">Previous</button><button data-booking-view="cancelled">Cancelled</button><button data-booking-view="details">My Details</button></nav><p id="portalMessage" aria-live="polite"></p><section id="customerBookingList" class="booking-card-list"></section><section id="customerProfile" class="portal-card" hidden><h2>My Details</h2><form id="customerProfileForm"><label>Name<input id="profileName" required></label><label>Phone<input id="profilePhone"></label><label>Email<input id="profileEmail" disabled></label><button type="submit">Save Details</button></form></section></main><dialog id="customerBookingDialog" class="portal-dialog"><button id="closeCustomerBooking" class="dialog-close" type="button">Close</button><div id="customerBookingDetail"></div></dialog></body></html>
