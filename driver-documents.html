<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Documents</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="admin-layout"><aside class="sidebar"><h2>Transport Admin</h2><a href="dashboard.html">🏠 Dashboard</a><a href="bookings.html">📖 Bookings</a><a href="drivers.html">🚖 Drivers</a><a class="active" href="driver-documents.html">📄 Driver Documents</a><a href="email-usage.html">✉️ Email Usage</a><a href="settings.html">⚙️ Settings</a></aside><main class="main"><div class="topbar"><div><h2>Driver Documents</h2><small>Company-scoped expiry and recheck dates</small></div></div><section class="card"><h3>Add or update document</h3><form id="documentForm"><input id="documentId" type="hidden"><div class="grid-2"><label>Driver<select id="documentDriver" required></select></label><label>Document type<select id="documentType" required><option value="taxi_badge">Taxi driver licence / badge</option><option value="driving_licence">Driving licence</option><option value="dbs_recheck">DBS renewal / recheck</option><option value="insurance">Insurance</option><option value="other">Other</option></select></label><label>Custom label<input id="documentLabel" maxlength="120"></label><label>Expiry / recheck date<input id="documentExpiry" type="date" required></label><label>Optional reference<input id="documentReference" maxlength="120"></label><label>Status<select id="documentStatus"><option value="active">Active</option><option value="expired">Expired</option><option value="replaced">Replaced</option><option value="cancelled">Cancelled</option></select></label></div><p><button type="submit">Save Document</button> <button id="cancelDocumentEdit" type="button" hidden>Cancel Edit</button></p></form></section><section class="card"><h3>Recorded documents</h3><div style="overflow:auto"><table><thead><tr><th>Driver</th><th>Document</th><th>Expiry / recheck</th><th>Status</th><th>Reference</th><th></th></tr></thead><tbody id="documentRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/admin.js"></script><script src="js/driver-documents.js"></script></body></html>
