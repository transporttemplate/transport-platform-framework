<main class="main">
<div class="topbar">
<div class="topbar-left">
<button class="menu-toggle" id="menuToggle" type="button">☰</button>
<div><h2>System Settings</h2><small>References, formats and platform defaults</small></div>
</div>
<button id="saveSettings" type="button">💾 Save Changes</button>
</div>
<div style="margin-bottom:20px;"><a href="settings.html">← Back to Settings</a></div>

<div class="card"><h3>⚙️ System Settings</h3><div class="grid-2"><div>
<label>Booking Prefix</label><input id="bookingPrefix" type="text">
<label>Invoice Prefix</label><input id="invoicePrefix" type="text">
<label>Driver Statement Prefix</label><input id="statementPrefix" type="text">
<label>Quote Prefix</label><input id="quotePrefix" type="text">
<label>Date Format</label><select id="dateFormat"><option>DD/MM/YYYY</option><option>MM/DD/YYYY</option><option>YYYY-MM-DD</option></select>
</div><div>
<label>Time Format</label><select id="timeFormat"><option>24 Hour</option><option>12 Hour</option></select>
<label>Default Language</label><select id="language"><option>English</option></select>
<label>Default Currency Symbol</label><input id="currencySymbol" type="text">
</div></div></div>

</main>
