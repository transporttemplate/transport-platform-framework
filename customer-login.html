<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/customer-portal.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase.js"></script><script defer src="js/config.js"></script><script defer src="js/customer-login.js"></script></head><body><main class="portal-shell"><section class="portal-card"><h1>Manage your bookings</h1><p>Sign in or create an account for this transport company.</p><div class="portal-tabs"><button type="button" data-auth-view="login" class="active">Sign In</button><button type="button" data-auth-view="signup">Create Account</button></div><form id="customerAuthForm"><label>Email<input id="customerEmail" type="email" autocomplete="email" required></label><label>Password<input id="customerPassword" type="password" minlength="8" autocomplete="current-password" required></label><button id="customerAuthSubmit" type="submit">Sign In</button></form><button id="forgotCustomerPassword" class="link-button" type="button">Forgot password?</button><p id="customerAuthMessage" aria-live="polite"></p><a id="customerBackHome" href="index.html">Return to website</a></section></main></body></html>
