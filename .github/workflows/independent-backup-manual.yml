name: Independent production backup (manual approval only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-platform-production-backup
  cancel-in-progress: false

jobs:
  backup:
    environment: production-backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL and AWS clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client awscli
      - run: npm ci
      - name: Run encrypted independent backup
        env:
          BACKUP_PLATFORM_AUTHORITY: verified_super_admin
          BACKUP_PRODUCTION_CONFIRMATION: EXPORT PRODUCTION TO APPROVED DESTINATION
          BACKUP_DESTINATION: s3
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: transport-platform
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGPORT: ${{ secrets.BACKUP_PGPORT }}
          PGDATABASE: postgres
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          PGSSLMODE: require
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_FAILURE_WEBHOOK_URL: ${{ secrets.BACKUP_FAILURE_WEBHOOK_URL }}
        run: npm run backup:production
