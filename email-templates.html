<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Templates</title><link rel="stylesheet" href="css/admin.css"><style>.template-help{overflow-wrap:anywhere}.delivery-scroll{overflow-x:auto}.template-preview{padding:18px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}@media(max-width:700px){.grid-2{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar button{width:100%}}</style></head><body><div class="overlay" id="overlay"></div><div class="admin-layout"><aside class="sidebar" id="sidebar"><h2>Transport Admin</h2><a href="dashboard.html">🏠 Dashboard</a><a href="bookings.html">📖 Bookings</a><a href="accounts.html">💷 Finance</a><a class="active" href="email-templates.html">📧 Email Templates</a><a href="settings.html">⚙️ Settings</a></aside><main class="main"><div class="topbar"><div class="topbar-left"><button class="menu-toggle" id="menuToggle" type="button">☰</button><h2>Email Templates</h2></div><button id="saveTemplate">Save Template</button></div><div class="grid-2"><section class="card"><label>Template<select id="templateKey"></select></label><p><strong>Available placeholders</strong></p><p id="placeholderList" class="template-help"></p><p id="templateValidation" role="status"></p><label>Active <input id="templateActive" type="checkbox" checked style="width:auto"></label></section><section class="card"><label>Subject<input id="templateSubject"></label><label>Body<textarea id="templateBody" rows="18"></textarea></label></section></div><section class="card"><h3>Preview</h3><div id="templatePreview" class="template-preview"></div></section><section class="card"><h3>Recent deliveries</h3><div class="delivery-scroll"><table><thead><tr><th>Date</th><th>Template</th><th>Recipient type</th><th>Recipient</th><th>Status</th><th>Error</th></tr></thead><tbody id="deliveryRows"></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/admin.js"></script><script src="js/email-templates.js"></script></body></html>
